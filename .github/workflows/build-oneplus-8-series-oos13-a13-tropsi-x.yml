name: Build OnePlus 8 Series (OxygenOS 13 A13) (Tropsi-X Kernel)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8_cn"
  DEVICE_CODENAME : "instantnoodle"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- KBUILD_BUILD_USER=root KBUILD_BUILD_HOST=dg02-pool06-kvm47"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/TropsPk/Tropsi_X_Kernel_SM8250.git"
  KERNEL_BRANCH : "Stock"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-r416183b.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk , next, bakasu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/TropsPk/OP8_AnyKernel3.git"
  AK3_BRANCH : "main"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oxygen13.1_a13_Tropsi_X"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "op_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "tropspk_oos" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.
  FGETPRIORITY_ENABLE: "false" #if u need hide getpriority.
  VPNHIDE_ENABLE: "false" #if u need hide vpn status.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: OnePlus 8 Series (OxygenOS 13 A13) (Tropsi-X Kernel)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

          # Spoof exact stock OnePlus 8 ColorOS 13.1 F.74 build metadata
          echo "KBUILD_BUILD_USER=root" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=dg02-pool06-kvm47" >> $GITHUB_ENV
          echo "KBUILD_BUILD_TIMESTAMP=Thu Jun 6 00:12:43 CST 2024" >> $GITHUB_ENV

          # Set stock localversion (-perf+) and prevent scripts/setlocalversion from appending anything
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf+"/' ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          grep -q '^CONFIG_LOCALVERSION="-perf+"' ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }} || echo 'CONFIG_LOCALVERSION="-perf+"' >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          printf '#!/bin/sh\necho -perf+\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          # Spoof /proc/version (fs/proc/version.c) with stock OnePlus 8 ColorOS 13.1 F.74 compiler string
          cat << 'EOF' > fs/proc/version.c
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/fs.h>
          #include <linux/init.h>
          #include <linux/kernel.h>
          #include <linux/proc_fs.h>
          #include <linux/seq_file.h>
          #include <linux/utsname.h>

          static int version_proc_show(struct seq_file *m, void *v)
          {
              seq_printf(m,
                  "%s version %s (root@dg02-pool06-kvm47) (clang version 10.0.7 for Android NDK, GNU ld (binutils-2.27-bd24d23f) 2.27.0.20170315) %s\n",
                  utsname()->sysname,
                  utsname()->release,
                  utsname()->version);
              return 0;
          }

          static int __init proc_version_init(void)
          {
              proc_create_single("version", 0, NULL, version_proc_show);
              return 0;
          }
          fs_initcall(proc_version_init);
          EOF

          # Spoof linux_banner and linux_proc_banner in init/version.c
          python3 - << 'PYEOF'
          with open("init/version.c", "r") as f:
              c = f.read()
          c = c.replace(
              '" (" LINUX_COMPILE_BY "@"\n\tLINUX_COMPILE_HOST ") (" LINUX_COMPILER ") "',
              '" (root@dg02-pool06-kvm47) (clang version 10.0.7 for Android NDK, GNU ld (binutils-2.27-bd24d23f) 2.27.0.20170315) "'
          )
          c = c.replace(
              '\t" (" LINUX_COMPILE_BY "@" LINUX_COMPILE_HOST ")"\n\t" (" LINUX_COMPILER ") %s\\n";',
              '\t" (root@dg02-pool06-kvm47) (clang version 10.0.7 for Android NDK, GNU ld (binutils-2.27-bd24d23f) 2.27.0.20170315) %s\\n";'
          )
          with open("init/version.c", "w") as f:
              f.write(c)
          PYEOF

          # Fix binder sender_euid for daemons (e.g. OhMyKeymint) that drop UID after opening /dev/binder
          sed -i 's/t->sender_euid = proc->cred->euid;/t->sender_euid = task_euid(proc->tsk);/' drivers/android/binder.c
          grep -q 't->sender_euid = task_euid(proc->tsk);' drivers/android/binder.c

          # 1) Fix selinux_hide timing side-channel (stack buffers + equalize failure latency)
          # 2) Filter cross-app getpriority/setpriority & ioprio_get/ioprio_set in kernel source
          # 3) Hide residual KSU/SuSFS/BBG symbols in /proc/kallsyms
          python3 - << 'PYEOF'
          import os

          # --- 1. drivers/kernelsu/feature/selinux_hide/selinux_hide_auto.c ---
          sh_path = "drivers/kernelsu/feature/selinux_hide/selinux_hide_auto.c"
          if not os.path.exists(sh_path):
              sh_path = "drivers/kernelsu/feature/selinux_hide.c"
          with open(sh_path, "r") as f:
              sh = f.read()

          def replace_once(src, old, new, desc):
              cnt = src.count(old)
              assert cnt == 1, f"{sh_path}: {desc} count={cnt}"
              return src.replace(old, new, 1)

          sh = replace_once(
              sh,
              "#include <linux/cpu.h>\n",
              "#include <linux/cpu.h>\n#include <linux/processor.h>\n",
              "processor.h include",
          )

          sh = replace_once(
              sh,
              "static bool ksu_selinux_hide_keep_backup __read_mostly = false;\n",
              """static bool ksu_selinux_hide_keep_backup __read_mostly = false;

          static inline u64 ksu_read_cntvct(void)
          {
          #ifdef CONFIG_ARM64
              u64 cval;
              asm volatile("isb; mrs %0, cntvct_el0" : "=r"(cval) :: "memory");
              return cval;
          #else
              return 0;
          #endif
          }

          static inline void ksu_equalize_timing_ticks(u64 t0, int rc, u64 target_ticks)
          {
              if (likely(!rc))
                  return;
          #ifdef CONFIG_ARM64
              while ((s64)(ksu_read_cntvct() - t0) < (s64)target_ticks)
                  cpu_relax();
          #else
              (void)t0;
              (void)target_ticks;
          #endif
          }

          static inline void ksu_equalize_invalid_timing(u64 t0, int rc)
          {
              ksu_equalize_timing_ticks(t0, rc, 48);
          }
          """.replace("\n          ", "\n"),
              "timing helpers",
          )

          sh = replace_once(
              sh,
              """static ssize_t my_write_context(struct file *file, char *buf, size_t size)
          {
              // apply to all app uids
              if (likely(ksu_get_uid_t(current_uid()) < 10000)) {
                  return orig_context_write(file, buf, size);
              }
              char *canon = NULL;""".replace("\n          ", "\n"),
              """static ssize_t my_write_context(struct file *file, char *buf, size_t size)
          {
              // apply to all app uids
              if (likely(ksu_get_uid_t(current_uid()) < 10000)) {
                  return orig_context_write(file, buf, size);
              }
              u64 ksu_t0 = ksu_read_cntvct();
              char *canon = NULL;""".replace("\n          ", "\n"),
              "my_write_context entry",
          )

          sh = replace_once(
              sh,
              """    memcpy(buf, canon, len);
              length = len;
          out:
              kfree(canon);
              return length;
          }""".replace("\n          ", "\n"),
              """    memcpy(buf, canon, len);
              length = len;
          out:
              kfree(canon);
              if (length < 0)
                  ksu_equalize_invalid_timing(ksu_t0, (int)length);
              return length;
          }""".replace("\n          ", "\n"),
              "my_write_context exit",
          )

          sh = replace_once(
              sh,
              """static ssize_t my_write_access(struct file *file, char *buf, size_t size)
          {
              // apply to all app uids
              if (likely(ksu_get_uid_t(current_uid()) < 10000)) {
                  return orig_access_write(file, buf, size);
              }
              char *scon = NULL, *tcon = NULL;""".replace("\n          ", "\n"),
              """static ssize_t my_write_access(struct file *file, char *buf, size_t size)
          {
              // apply to all app uids
              if (likely(ksu_get_uid_t(current_uid()) < 10000)) {
                  return orig_access_write(file, buf, size);
              }
              u64 ksu_t0 = ksu_read_cntvct();
              char *scon = NULL, *tcon = NULL;""".replace("\n          ", "\n"),
              "my_write_access entry",
          )

          sh = replace_once(
              sh,
              """                       avd.auditdeny, avd.seqno, avd.flags);
          out:
              kfree(tcon);
              kfree(scon);
              return length;
          }""".replace("\n          ", "\n"),
              """                       avd.auditdeny, avd.seqno, avd.flags);
          out:
              kfree(tcon);
              kfree(scon);
              if (length < 0)
                  ksu_equalize_invalid_timing(ksu_t0, (int)length);
              return length;
          }""".replace("\n          ", "\n"),
              "my_write_access exit",
          )

          sh = replace_once(
              sh,
              """    error = ksu_avc_has_perm_compat(mysid, mysid, SECCLASS_PROCESS, PROCESS__SETCURRENT, NULL);
              if (error)
                  return error;

              /* Obtain a SID for the context, if one was specified. */""".replace("\n          ", "\n"),
              """    error = ksu_avc_has_perm_compat(mysid, mysid, SECCLASS_PROCESS, PROCESS__SETCURRENT, NULL);
              if (error)
                  return error;

              u64 ksu_t0 = ksu_read_cntvct();

              /* Obtain a SID for the context, if one was specified. */""".replace("\n          ", "\n"),
              "ksu_handle_selinux_setprocattr entry timing",
          )

          sh = replace_once(
              sh,
              "        error = security_context_to_sid_live(value, size, &sid);\n"
              "        if (error) {\n"
              "            return error;\n"
              "        }\n",
              "        error = security_context_to_sid_live(value, size, &sid);\n"
              "        if (error) {\n"
              "            ksu_equalize_timing_ticks(ksu_t0, error, 64);\n"
              "            return error;\n"
              "        }\n",
              "ksu_handle_selinux_setprocattr invalid timing",
          )

          sh = replace_once(
              sh,
              """abort_change:
              abort_creds(new);
              return error;""".replace("\n          ", "\n"),
              """abort_change:
              abort_creds(new);
              ksu_equalize_timing_ticks(ksu_t0, error, 64);
              return error;""".replace("\n          ", "\n"),
              "ksu_handle_selinux_setprocattr abort timing",
          )

          sh = replace_once(
              sh,
              """    char *scontext2;
              struct context context, orig_context;
              int rc = 0, orig_rc = -EINVAL;
              u32 orig_sid;
              u32 policy_generation;

              /* An empty security context is never valid. */
              if (!scontext_len)
                  return -EINVAL;

              /* Copy the string to allow changes and ensure a NUL terminator */
              scontext2 = kmemdup_nul(scontext, scontext_len, gfp_flags);
              if (!scontext2)
                  return -ENOMEM;""".replace("\n          ", "\n"),
              """    char stack_buf2[128];
              char *scontext2;
              struct context context, orig_context;
              int rc = 0, orig_rc = -EINVAL;
              u32 orig_sid;
              u32 policy_generation;

              /* An empty security context is never valid. */
              if (!scontext_len)
                  return -EINVAL;

              /* Copy the string to allow changes and ensure a NUL terminator */
              if (scontext_len < sizeof(stack_buf2)) {
                  memcpy(stack_buf2, scontext, scontext_len);
                  stack_buf2[scontext_len] = '\\0';
                  scontext2 = stack_buf2;
              } else {
                  scontext2 = kmemdup_nul(scontext, scontext_len, gfp_flags);
                  if (!scontext2)
                      return -ENOMEM;
              }""".replace("\n          ", "\n"),
              "ksu_security_context_to_sid stack_buf2 alloc",
          )

          sh = replace_once(
              sh,
              """    if (orig_rc_p)
                  *orig_rc_p = orig_rc;
              kfree(scontext2);
              return rc;
          }""".replace("\n          ", "\n"),
              """    if (orig_rc_p)
                  *orig_rc_p = orig_rc;
              if (scontext2 != stack_buf2)
                  kfree(scontext2);
              return rc;
          }""".replace("\n          ", "\n"),
              "ksu_security_context_to_sid stack_buf2 free",
          )

          sh = replace_once(
              sh,
              """    struct context context;
              char *scontext2;
              u32 backup_sid, policy_generation;
              int rc;

              /* An empty security context is never valid. */
              if (!scontext_len)
                  return -EINVAL;

              /* Copy the string to allow changes and ensure a NUL terminator */
              scontext2 = kmemdup_nul(scontext, scontext_len, GFP_KERNEL);
              if (!scontext2)
                  return -ENOMEM;""".replace("\n          ", "\n"),
              """    struct context context;
              char stack_buf2[128];
              char *scontext2;
              u32 backup_sid, policy_generation;
              int rc;

              /* An empty security context is never valid. */
              if (!scontext_len)
                  return -EINVAL;

              /* Copy the string to allow changes and ensure a NUL terminator */
              if (scontext_len < sizeof(stack_buf2)) {
                  memcpy(stack_buf2, scontext, scontext_len);
                  stack_buf2[scontext_len] = '\\0';
                  scontext2 = stack_buf2;
              } else {
                  scontext2 = kmemdup_nul(scontext, scontext_len, GFP_KERNEL);
                  if (!scontext2)
                      return -ENOMEM;
              }""".replace("\n          ", "\n"),
              "security_context_to_sid_live stack_buf2 alloc",
          )

          sh = replace_once(
              sh,
              """    kfree(scontext2);
              return rc;
          }

          /*
           * Write the security context string representation of""".replace("\n          ", "\n"),
              """    if (scontext2 != stack_buf2)
                  kfree(scontext2);
              return rc;
          }

          /*
           * Write the security context string representation of""".replace("\n          ", "\n"),
              "security_context_to_sid_live stack_buf2 free",
          )

          with open(sh_path, "w") as f:
              f.write(sh)

          # --- 2a. kernel/sys.c ---
          with open("kernel/sys.c", "r") as f:
              sysc = f.read()
          old_sys = "\t\telse if (!uid_eq(uid, cred->uid)) {"
          new_sys = "\t\telse if (!uid_eq(uid, cred->uid)) {\n\t\t\tif (cred->uid.val >= 10000 && uid.val >= 10000)\n\t\t\t\tgoto out_unlock;"
          assert sysc.count(old_sys) == 2, f"kernel/sys.c count={sysc.count(old_sys)}"
          sysc = sysc.replace(old_sys, new_sys)
          with open("kernel/sys.c", "w") as f:
              f.write(sysc)

          # --- 2b. block/ioprio.c ---
          with open("block/ioprio.c", "r") as f:
              iop = f.read()
          old_iop_susfs = (
              "\t\t\tif (!who)\n"
              "\t\t\t\tuser = current_user();\n"
              "\t\t\telse\n"
              "#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n"
              "\t\t\t{\n"
              "\t\t\t\tif (current_uid().val >= 10000 && susfs_is_priority_uid_filtered(uid.val))\n"
              "\t\t\t\t\tbreak;\n"
              "\t\t\t\tuser = find_user(uid);\n"
              "\t\t\t}\n"
              "#else\n"
              "\t\t\t\tuser = find_user(uid);\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER"
          )
          old_iop_plain = "\t\t\tif (!who)\n\t\t\t\tuser = current_user();\n\t\t\telse\n\t\t\t\tuser = find_user(uid);"
          new_iop = (
              "\t\t\tif (!who)\n"
              "\t\t\t\tuser = current_user();\n"
              "\t\t\telse {\n"
              "\t\t\t\tif (current_uid().val >= 10000 && uid.val >= 10000 && !uid_eq(uid, current_uid()))\n"
              "\t\t\t\t\tbreak;\n"
              "#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n"
              "\t\t\t\tif (current_uid().val >= 10000 && susfs_is_priority_uid_filtered(uid.val))\n"
              "\t\t\t\t\tbreak;\n"
              "#endif\n"
              "\t\t\t\tuser = find_user(uid);\n"
              "\t\t\t}"
          )
          if iop.count(old_iop_susfs) == 2:
              iop = iop.replace(old_iop_susfs, new_iop)
          elif iop.count(old_iop_plain) == 2:
              iop = iop.replace(old_iop_plain, new_iop)
          else:
              raise AssertionError(f"block/ioprio.c unexpected format: susfs={iop.count(old_iop_susfs)} plain={iop.count(old_iop_plain)}")
          with open("block/ioprio.c", "w") as f:
              f.write(iop)

          # --- 3. kernel/kallsyms.c ---
          with open("kernel/kallsyms.c", "r") as f:
              ks = f.read()
          old_ks = "\t/* Some debugging symbols have no name.  Ignore them. */\n\tif (!iter->name[0])\n\t\treturn 0;"
          new_ks = (
              "\t/* Some debugging symbols have no name.  Ignore them. */\n"
              "\tif (!iter->name[0])\n"
              "\t\treturn 0;\n"
              "\tif (!strncmp(iter->name, \"ksu_\", 4) || strstr(iter->name, \"_ksu_\") ||\n"
              "\t    strstr(iter->name, \".ksu_\") || strstr(iter->name, \"kernelsu\") ||\n"
              "\t    !strncmp(iter->name, \"susfs_\", 6) || strstr(iter->name, \"_susfs_\") ||\n"
              "\t    !strncmp(iter->name, \"bbg_\", 4) || strstr(iter->name, \"_bbg_\") ||\n"
              "\t    strstr(iter->name, \"baseband_guard\") ||\n"
              "\t    strstr(iter->name, \"selinux_hide\") ||\n"
              "\t    strstr(iter->name, \"magisk\") ||\n"
              "\t    !strncmp(iter->name, \"bb_bprm_\", 8))\n"
              "\t\treturn 0;"
          )
          assert ks.count(old_ks) == 1, f"kernel/kallsyms.c count={ks.count(old_ks)}"
          ks = ks.replace(old_ks, new_ks)
          with open("kernel/kallsyms.c", "w") as f:
              f.write(ks)

          # --- 4. net/core/rtnetlink.c (Block RTM_GETLINK hardware MAC leak) ---
          with open("net/core/rtnetlink.c", "r") as f:
              rtn = f.read()
          old_rtn = (
              "\tif (dev->addr_len) {\n"
              "\t\tif (nla_put(skb, IFLA_ADDRESS, dev->addr_len, dev->dev_addr) ||\n"
              "\t\t    nla_put(skb, IFLA_BROADCAST, dev->addr_len, dev->broadcast))\n"
              "\t\t\tgoto nla_put_failure;\n"
              "\t}"
          )
          new_rtn = (
              "\tif (dev->addr_len) {\n"
              "\t\tconst void *src_addr = dev->dev_addr;\n"
              "\t\tunsigned char zero_addr[MAX_ADDR_LEN] = {0};\n"
              "\t\tif (current_uid().val >= 10000 && !capable(CAP_NET_ADMIN))\n"
              "\t\t\tsrc_addr = zero_addr;\n"
              "\t\tif (nla_put(skb, IFLA_ADDRESS, dev->addr_len, src_addr) ||\n"
              "\t\t    nla_put(skb, IFLA_BROADCAST, dev->addr_len, dev->broadcast))\n"
              "\t\t\tgoto nla_put_failure;\n"
              "\t}"
          )
          assert rtn.count(old_rtn) == 1, f"net/core/rtnetlink.c count={rtn.count(old_rtn)}"
          rtn = rtn.replace(old_rtn, new_rtn)
          with open("net/core/rtnetlink.c", "w") as f:
              f.write(rtn)

          # --- 5. net/core/neighbour.c (Block RTM_GETNEIGH ARP neighbor leak) ---
          with open("net/core/neighbour.c", "r") as f:
              nbr = f.read()
          old_nbr = "static int neigh_dump_info(struct sk_buff *skb, struct netlink_callback *cb)\n{"
          new_nbr = (
              "static int neigh_dump_info(struct sk_buff *skb, struct netlink_callback *cb)\n"
              "{\n"
              "\tif (current_uid().val >= 10000 && !capable(CAP_NET_ADMIN))\n"
              "\t\treturn -EPERM;"
          )
          assert nbr.count(old_nbr) == 1, f"net/core/neighbour.c count={nbr.count(old_nbr)}"
          nbr = nbr.replace(old_nbr, new_nbr)
          with open("net/core/neighbour.c", "w") as f:
              f.write(nbr)

          # --- 6. drivers/kernelsu/supercall/supercall.c (Block unprivileged KSU_INSTALL_MAGIC2 probe) ---
          with open("drivers/kernelsu/supercall/supercall.c", "r") as f:
              sc = f.read()
          old_sc = (
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)\n"
              "{\n"
              "    if (magic1 != KSU_INSTALL_MAGIC1)\n"
              "        return -EINVAL;"
          )
          new_sc = (
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)\n"
              "{\n"
              "    if (magic1 != KSU_INSTALL_MAGIC1)\n"
              "        return -EINVAL;\n\n"
              "    if (ksu_get_uid_t(current_uid()) >= 10000 && !allowed_for_su())\n"
              "        return -EINVAL;"
          )
          assert sc.count(old_sc) == 1, f"supercall.c count={sc.count(old_sc)}"
          sc = sc.replace(old_sc, new_sc)
          with open("drivers/kernelsu/supercall/supercall.c", "w") as f:
              f.write(sc)

          print("[+] All 6 kernel optimization patches (selinux, sys, ioprio, kallsyms, netlink, supercall) applied cleanly.")
          PYEOF

